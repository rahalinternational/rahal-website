<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap');
  body { margin: 0; }
</style>
</helmet>
<div style="position:sticky;top:0;z-index:50;background:#ffffff;border-bottom:1px solid #e3e7dd;font-family:'Inter',Arial,sans-serif;">
  <div style="max-width:1200px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
    <a href="./Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
      <img src="./logo.png" alt="Rahal International" style="height:44px;width:auto;display:block;" />
      <span style="font-family:'Archivo',Arial,sans-serif;font-weight:800;font-size:19px;letter-spacing:0.3px;color:#1e4d2e;line-height:1.1;">RAHAL<br /><span style="font-family:'Inter',Arial,sans-serif;font-weight:500;font-size:11px;letter-spacing:2px;color:#5c6660;">INTERNATIONAL</span></span>
    </a>
    <nav style="display:none;align-items:center;gap:32px;flex:1;justify-content:center;" class="rahal-nav-desktop">
      <a href="./Home.dc.html" style="text-decoration:none;font-size:15px;color:{{ homeColor }};font-weight:{{ homeWeight }};">Home</a>
      <a href="./About.dc.html" style="text-decoration:none;font-size:15px;color:{{ aboutColor }};font-weight:{{ aboutWeight }};">About</a>
      <a href="./Products.dc.html" style="text-decoration:none;font-size:15px;color:{{ productsColor }};font-weight:{{ productsWeight }};">Products</a>
      <a href="./Contact.dc.html" style="text-decoration:none;font-size:15px;color:{{ contactColor }};font-weight:{{ contactWeight }};">Contact</a>
    </nav>
    <div style="display:none;align-items:center;gap:16px;" class="rahal-nav-desktop">
      <a href="mailto:sales@rahalintl.com" style="text-decoration:none;background:#1e4d2e;color:#ffffff;padding:11px 22px;border-radius:4px;font-size:14px;font-weight:600;white-space:nowrap;" style-hover="background:#163a22;">Contact Sales</a>
    </div>
    <button onClick="{{ toggle }}" aria-label="Menu" style="display:flex;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;" class="rahal-nav-mobile">
      <span style="width:24px;height:2px;background:#1e4d2e;display:block;"></span>
      <span style="width:24px;height:2px;background:#1e4d2e;display:block;"></span>
      <span style="width:24px;height:2px;background:#1e4d2e;display:block;"></span>
    </button>
  </div>
  <sc-if value="{{ mobileOpen }}">
    <div style="border-top:1px solid #e3e7dd;padding:12px 32px 20px;display:flex;flex-direction:column;gap:16px;">
      <a onClick="{{ close }}" href="./Home.dc.html" style="text-decoration:none;font-size:16px;color:{{ homeColor }};font-weight:{{ homeWeight }};">Home</a>
      <a onClick="{{ close }}" href="./About.dc.html" style="text-decoration:none;font-size:16px;color:{{ aboutColor }};font-weight:{{ aboutWeight }};">About</a>
      <a onClick="{{ close }}" href="./Products.dc.html" style="text-decoration:none;font-size:16px;color:{{ productsColor }};font-weight:{{ productsWeight }};">Products</a>
      <a onClick="{{ close }}" href="./Contact.dc.html" style="text-decoration:none;font-size:16px;color:{{ contactColor }};font-weight:{{ contactWeight }};">Contact</a>
      <a onClick="{{ close }}" href="mailto:sales@rahalintl.com" style="text-decoration:none;background:#1e4d2e;color:#ffffff;padding:12px 22px;border-radius:4px;font-size:15px;font-weight:600;text-align:center;">Contact Sales</a>
    </div>
  </sc-if>
  <style>
    @media (min-width: 900px) {
      .rahal-nav-desktop { display: flex !important; }
      .rahal-nav-mobile { display: none !important; }
    }
  </style>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;current&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;home&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { mobileOpen: false };
  renderVals() {
    const current = this.props.current ?? 'home';
    const active = '#1e4d2e';
    const inactive = '#3a3f38';
    return {
      mobileOpen: this.state.mobileOpen,
      toggle: () => this.setState(s => ({ mobileOpen: !s.mobileOpen })),
      close: () => this.setState({ mobileOpen: false }),
      homeColor: current === 'home' ? active : inactive,
      aboutColor: current === 'about' ? active : inactive,
      productsColor: current === 'products' ? active : inactive,
      contactColor: current === 'contact' ? active : inactive,
      homeWeight: current === 'home' ? 700 : 500,
      aboutWeight: current === 'about' ? 700 : 500,
      productsWeight: current === 'products' ? 700 : 500,
      contactWeight: current === 'contact' ? 700 : 500,
    };
  }
}
</script>
</body>
</html>
